# Sync fix — the Linux / Amethyst fork's repair of a daily upstream sync that went wrong (docs/linux-and-amethyst.md,
# "Keeping up with upstream").
# What it does, in plain terms: when CI fails on the sync/upstream branch, or the sync's merge conflicts, Claude Code
# reads what broke, fixes it on that branch following CLAUDE.md and the fork guide, and CI runs again. A fix Claude made
# never merges by itself: the pull request's auto-merge is turned off and it waits for a person to review and merge it.
# One attempt per break: if the branch's newest commit is already Claude's, it stops and asks for a person.
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (made with `claude setup-token`); without it, it does nothing.
#
# Trust: Claude works over code merged from Avick3110/houseCARL, so anything in that code (a comment, a test name, a
# doc) is input it reads. To keep that from reaching the repository unreviewed, Claude runs in a job whose token can
# only READ the repository: it commits locally, and a second job with no Claude in it pushes those commits, to
# sync/upstream only, and only if the branch has not moved meanwhile. Claude's tools are limited to editing files and
# running dotnet, git and read-only gh. The action is pinned to a commit so a new release cannot change what runs.
name: Sync fix

on:
  workflow_run:
    workflows: ["CI", "Upstream sync"]
    types: [completed]

permissions: {}   # each job asks for what it needs

concurrency:
  group: sync-fix
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/Avick3110/houseCARL.git
  BASE: amethyst-linux
  SYNC: sync/upstream
  BOT_NAME: claude[bot]
  BOT_EMAIL: claude[bot]@users.noreply.github.com

jobs:
  # CI went red on the sync branch: Claude fixes it, with a read-only token.
  fix-ci:
    name: fix a red sync
    if: >-
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'sync/upstream'
    runs-on: ubuntu-latest
    permissions:
      contents: read         # read the code; the push job writes
      actions: read          # read the failed run's log
      pull-requests: write   # turn off auto-merge, comment
      id-token: write        # the action asks for it
    outputs:
      go: ${{ steps.guard.outputs.go }}
      before: ${{ steps.guard.outputs.before }}
      changed: ${{ steps.bundle.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Stop without the Claude token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "No CLAUDE_CODE_OAUTH_TOKEN secret; leaving the red sync for a person."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check out the sync branch
        if: steps.token.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SYNC }}
          fetch-depth: 0

      - name: One attempt per break
        id: guard
        if: steps.token.outputs.go == 'true'
        run: |
          git config user.name "$BOT_NAME"; git config user.email "$BOT_EMAIL"
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$(git log -1 --format=%an)" = "$BOT_NAME" ]; then
            gh pr comment "$SYNC" --body "CI is still red after Claude's fix attempt, so this needs a person. Failed run: ${{ github.event.workflow_run.html_url }}" || true
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            gh pr merge "$SYNC" --disable-auto || true   # a fix waits for a person
            gh run view "${{ github.event.workflow_run.id }}" --log-failed > "$RUNNER_TEMP/ci-failure.log" || true
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET 9
        if: steps.guard.outputs.go == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Fix it with Claude
        if: steps.guard.outputs.go == 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc   # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            This is the Linux / Amethyst fork of houseCARL. The daily merge of upstream (Avick3110/houseCARL main) into
            the branch sync/upstream made CI fail. Fix the cause on this branch.

            Read CLAUDE.md and docs/linux-and-amethyst.md first: the fork's rules and the reason for each fork change
            are there. The failed CI output is in ${{ runner.temp }}/ci-failure.log (run: ${{ github.event.workflow_run.html_url }}).

            Rules:
            - Keep upstream's change and the fork's reason for its own. Never change behaviour for Mod Organizer 2.
            - Never delete, skip or weaken a test to make it pass; fix the code or the fixture the test exposes.
            - Build and test with `dotnet build housecarl.sln -c Release` and
              `dotnet test src/housecarl-mcp-tests -c Release --no-build`, the same commands CI runs on the same kind
              of Linux runner. Tests that need Wine, Steam or the Creation Kit skip here, as they do in CI.
            - Commit small, with plain messages, on this branch. Do not push; the workflow pushes when you are done.
            - If you cannot fix it with confidence, commit nothing and say why in your final message.
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(dotnet:*),Bash(git:*),Bash(gh run view:*),Bash(gh pr view:*)"

      # Everything Claude committed, as a bundle the push job can fetch from; nothing when it committed nothing.
      - name: Bundle the fix
        id: bundle
        if: steps.guard.outputs.go == 'true' && always()
        run: |
          if [ "$(git rev-parse HEAD)" = "${{ steps.guard.outputs.before }}" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git bundle create "$RUNNER_TEMP/fix.bundle" "${{ steps.guard.outputs.before }}..HEAD"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Hand the fix to the push job
        if: steps.bundle.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sync-fix
          path: ${{ runner.temp }}/fix.bundle
          retention-days: 1

  # Pushes what Claude committed, to sync/upstream only, if the branch has not moved; no Claude in this job.
  push-ci-fix:
    name: push the fix, or ask for a person
    needs: fix-ci
    if: ${{ !cancelled() && needs.fix-ci.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the fix
      pull-requests: write   # comment
      actions: write         # start CI again
    env:
      GH_TOKEN: ${{ github.token }}
      BEFORE: ${{ needs.fix-ci.outputs.before }}
    steps:
      - name: Check out the sync branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SYNC }}
          fetch-depth: 0

      - name: Take the fix from the Claude job
        if: needs.fix-ci.outputs.changed == 'true'
        uses: actions/download-artifact@v7
        with:
          name: sync-fix
          path: ${{ runner.temp }}

      - name: Push the fix and run CI again, or ask for a person
        run: |
          run="${{ github.event.workflow_run.html_url }}"
          if [ "${{ needs.fix-ci.outputs.changed }}" != "true" ]; then
            gh pr comment "$SYNC" --body "Claude did not push a fix for the red CI run ($run); see this workflow's log for why. This needs a person."
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
            gh pr comment "$SYNC" --body "Claude made a fix for the red CI run ($run), but the branch moved while it worked, so nothing was pushed. This needs a person."
            exit 1
          fi
          git fetch "$RUNNER_TEMP/fix.bundle" HEAD
          git push origin "FETCH_HEAD:refs/heads/$SYNC"
          gh pr comment "$SYNC" --body "Claude pushed a fix for the red CI run ($run). CI is running again; auto-merge is off, so review and merge it yourself."
          gh workflow run CI --ref "$SYNC"

  # The sync's merge conflicted (the sync workflow failed): Claude resolves the merge, with a read-only token.
  fix-conflict:
    name: resolve a conflicting sync
    if: >-
      github.event.workflow_run.name == 'Upstream sync' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read         # read the code; the push job writes
      pull-requests: write   # comment on a waiting pull request
      id-token: write        # the action asks for it
    outputs:
      go: ${{ steps.merge.outputs.go }}
      sha: ${{ steps.merge.outputs.sha }}
      changed: ${{ steps.bundle.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Stop without the Claude token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "No CLAUDE_CODE_OAUTH_TOKEN secret; leaving the conflict for a person."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check out the fork's working branch
        if: steps.token.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE }}
          fetch-depth: 0

      - name: Start the merge again, leaving the conflicts in place
        id: merge
        if: steps.token.outputs.go == 'true'
        run: |
          git config user.name "$BOT_NAME"; git config user.email "$BOT_EMAIL"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream main
          # A sync pull request with auto-merge off is waiting for a person (a fix Claude made, or a hold): leave it be.
          waiting=$(gh pr list --head "$SYNC" --base "$BASE" --state open --json number,autoMergeRequest --jq '[.[] | select(.autoMergeRequest == null)][0].number // empty')
          if [ -n "$waiting" ]; then
            gh pr comment "$waiting" --body "Upstream main has moved on to $(git rev-parse --short upstream/main). This pull request is waiting for a review, so the sync left it as it is; merge or close it and the next sync takes the rest."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(git rev-parse --short upstream/main)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git switch -C "$SYNC"
          if git merge --no-ff --no-edit -m "Merge upstream main ($sha) into $BASE" upstream/main; then
            echo "The merge is clean now; nothing to resolve."; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET 9
        if: steps.merge.outputs.go == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Resolve it with Claude
        if: steps.merge.outputs.go == 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc   # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            This is the Linux / Amethyst fork of houseCARL. Merging upstream (Avick3110/houseCARL main, at
            ${{ steps.merge.outputs.sha }}) into the fork's branch amethyst-linux conflicts. The merge is in progress on
            the branch sync/upstream with the conflicts in the working tree; the conflicting files are listed in
            ${{ runner.temp }}/conflicts.txt.

            Read CLAUDE.md and docs/linux-and-amethyst.md first: the fork's rules, and the "What changed, and where"
            table that says where each fork change lives and why.

            Rules:
            - Resolve every conflict keeping both sides: upstream's change, and the fork's reason for its own. Never
              change behaviour for Mod Organizer 2.
            - Never delete, skip or weaken a test.
            - Finish the merge with `git commit --no-edit`, then build and test with `dotnet build housecarl.sln -c Release`
              and `dotnet test src/housecarl-mcp-tests -c Release --no-build`, the same commands CI runs on the same
              kind of Linux runner, fixing what the merge broke in small further commits. Tests that need Wine, Steam
              or the Creation Kit skip here, as they do in CI.
            - Do not push; the workflow pushes the branch when you are done.
            - If you cannot resolve it with confidence, run `git merge --abort` and say why in your final message.
          claude_args: >-
            --max-turns 120
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(dotnet:*),Bash(git:*)"

      # The finished merge and what followed it, as a bundle the push job can fetch from; nothing when the merge
      # was abandoned or never finished.
      - name: Bundle the resolved merge
        id: bundle
        if: steps.merge.outputs.go == 'true' && always()
        run: |
          if git rev-parse -q --verify MERGE_HEAD >/dev/null || ! git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git bundle create "$RUNNER_TEMP/fix.bundle" "origin/$BASE..HEAD"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Hand the merge to the push job
        if: steps.bundle.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sync-fix
          path: ${{ runner.temp }}/fix.bundle
          retention-days: 1

  # Pushes the resolved merge to sync/upstream and opens its pull request for review; no Claude in this job.
  push-conflict-fix:
    name: open the resolved merge for review, or ask for a person
    needs: fix-conflict
    if: ${{ !cancelled() && needs.fix-conflict.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the sync branch
      pull-requests: write   # open the pull request, turn off auto-merge
      actions: write         # start CI on it
      issues: write          # comment on the conflict issue
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.fix-conflict.outputs.sha }}
    steps:
      - name: Check out the fork's working branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE }}
          fetch-depth: 0

      - name: Take the merge from the Claude job
        if: needs.fix-conflict.outputs.changed == 'true'
        uses: actions/download-artifact@v7
        with:
          name: sync-fix
          path: ${{ runner.temp }}

      - name: Open the pull request for review and run CI, or ask for a person
        run: |
          issue=$(gh issue list --state open --search "in:title Upstream sync conflicts" --json number --jq '.[0].number // empty')
          if [ "${{ needs.fix-conflict.outputs.changed }}" != "true" ]; then
            [ -n "$issue" ] && gh issue comment "$issue" --body "Claude did not resolve the merge of upstream $SHA; see the Sync fix run's log for why. This needs a person."
            exit 0
          fi
          git fetch "$RUNNER_TEMP/fix.bundle" HEAD
          git push --force origin "FETCH_HEAD:refs/heads/$SYNC"
          title="Merge upstream main ($SHA), conflicts resolved by Claude"
          body="Claude resolved the conflicts merging upstream main ($SHA). Auto-merge is off: review the resolution and merge it yourself once CI passes. See docs/linux-and-amethyst.md, Keeping up with upstream."
          pr=$(gh pr list --head "$SYNC" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then gh pr create --head "$SYNC" --base "$BASE" --title "$title" --body "$body"
          else gh pr edit "$pr" --title "$title" --body "$body"; gh pr merge "$pr" --disable-auto || true; fi
          gh workflow run CI --ref "$SYNC"
          [ -n "$issue" ] && gh issue comment "$issue" --body "Claude resolved the merge; review it in the sync pull request." || true
