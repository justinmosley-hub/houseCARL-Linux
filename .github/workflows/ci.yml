# houseCARL CI — a green/red gate on every push to amethyst-linux and every pull request.
# What it does, in plain terms: a fresh Linux machine on GitHub's servers compiles houseCARL, runs its
# tests, builds the Linux package and validates it. Green = it builds, the tests pass and the package is
# sound; red = something broke. The tests that need Wine, Steam or the Creation Kit, none of which the
# runner has, report as skipped, so the run stays a reliable gate without them.
#
# This is the Linux / Amethyst fork (docs/linux-and-amethyst.md), so it builds and tests on Linux only:
# file names are case-sensitive, `\` is not a separator, and the Windows tools run through Wine. The
# Windows package is upstream's (Avick3110/houseCARL), built by upstream's CI.
#
# Also called by release.yml, so a release ships the package this run built and tested.
name: CI

on:
  push:
    branches: [main, amethyst-linux]   # amethyst-linux: the fork's working branch; main: a mirror of upstream
  pull_request:
  workflow_dispatch:   # a run started by hand (gh workflow run CI, or the Actions tab)
  workflow_call:       # release.yml runs this and publishes the package it uploads

# Cancel a superseded in-progress run on the SAME pull request when a newer commit is pushed
# (saves runner time and queue contention while iterating on a PR). Never cancel a push run:
# every commit that lands on amethyst-linux must be verified end-to-end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job's name is what the amethyst-linux branch protection requires; renaming it needs the rule changed too.
  linux:
    name: build + probes (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # Cache the NuGet package restore across runs (keyed on the project files, which pin the
      # package versions). Trims the restore inside the build step below; the build itself still
      # compiles the whole solution fresh every run.
      # The vendored Nifly package is left out, so every run restores it from packages/local, never a stale copy.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            !~/.nuget/packages/nifly
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'nuget.config', 'packages/local/*.nupkg') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build the whole solution (Release)
        run: dotnet build housecarl.sln --configuration Release

      # Every guard is an xUnit test in this project.
      - name: Tests — the 2.0 guard project (dotnet test)
        if: ${{ !cancelled() }}
        run: dotnet test src/housecarl-mcp-tests --configuration Release --no-build --logger "trx;LogFileName=guards.trx"

      # `dotnet test` exits 0 when it selects NOTHING — measured. So a filter added later (a new tier, a typo)
      # can take every guard out of CI and leave the step green with no signal. This reads the run's own trx
      # and fails on an empty or failing run, which is also what makes the --logger flag above load-bearing
      # rather than an artifact nobody opens. The floor is derived from the run, not a pinned number: it says
      # "something ran and nothing failed", and the count is printed so a collapse is visible.
      - name: Tests — the run was not empty (a filter that matches nothing exits 0)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Recurse -Filter guards.trx src/housecarl-mcp-tests/TestResults |
                 Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $trx) { throw "No guards.trx was produced - the test step did not run to completion." }
          $c = ([xml](Get-Content $trx.FullName)).TestRun.ResultSummary.Counters
          "guards.trx: total=$($c.total) executed=$($c.executed) passed=$($c.passed) failed=$($c.failed)"
          if ([int]$c.executed -eq 0) { throw "The guard suite selected ZERO tests. The filter excludes everything it should not." }
          if ([int]$c.failed -ne 0) { throw "$($c.failed) guard test(s) failed." }

      # The real `claude plugin validate --strict`, on the real assembled plugin tree. This is the
      # validator the harness ships, so it is the only check that agrees with the harness by
      # construction; PluginValidateFrontmatterTests in the suite is a YAML proxy for it. The version is
      # pinned so a CLI release cannot turn this step red on its own. `validate` reads files and
      # exits — it needs no API key and no login.
      - name: Set up Node 22
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the Claude Code CLI
        if: ${{ !cancelled() }}
        run: npm install -g @anthropic-ai/claude-code@2.1.245

      # The whole Linux package: corpus, server publish, notices, skills, leak-checks, zip.
      - name: Build the Linux package
        id: package
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/build-plugin.ps1 -Runtime linux-x64

      # The package build rewrites the two tracked THIRD-PARTY-NOTICES.txt copies from the server it just
      # published, so a dependency bump changes what they should say. The step goes red if either tracked copy
      # now differs from what ships: commit the rewritten copies.
      - name: Notices — the tracked copies match what ships
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: git diff --exit-code -- THIRD-PARTY-NOTICES.txt plugin/THIRD-PARTY-NOTICES.txt

      - name: Validate the Linux plugin package (claude plugin validate --strict)
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: claude plugin validate ./dist/housecarl --strict

      # The server must stay executable through the zip, or Claude Code cannot start it after unzipping.
      - name: The packaged server is executable after unzipping
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/unzipped" && unzip -q release/houseCARL-*-linux-x64.zip -d "$RUNNER_TEMP/unzipped"
          test -x "$RUNNER_TEMP/unzipped/houseCARL/housecarl/server/housecarl-mcp"
          test -f "$RUNNER_TEMP/unzipped/houseCARL/housecarl/server/corpus.json"

      # The zip this run built and checked, kept two weeks: release.yml publishes it, and anyone can try a
      # pull request's package without building it.
      - name: Upload the Linux package
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-package
          path: release/houseCARL-*-linux-x64.zip
          if-no-files-found: error
          retention-days: 14
